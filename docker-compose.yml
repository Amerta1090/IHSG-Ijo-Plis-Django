services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ihsg_db
      POSTGRES_USER: ihsg_user
      POSTGRES_PASSWORD: ihsg_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
