services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ihsg_db
      POSTGRES_USER: ihsg_user
      POSTGRES_PASSWORD: ihsg_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihsg_user -d ihsg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ihsg_db}
      DB_USER: ${DB_USER:-ihsg_user}
      DB_PASSWORD: ${DB_PASSWORD:-ihsg_pass}
      REDIS_HOST: redis
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}

  celery_worker:
    build: .
    command: celery -A config worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ihsg_db}
      DB_USER: ${DB_USER:-ihsg_user}
      DB_PASSWORD: ${DB_PASSWORD:-ihsg_pass}
      REDIS_HOST: redis
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}

  celery_beat:
    build: .
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ihsg_db}
      DB_USER: ${DB_USER:-ihsg_user}
      DB_PASSWORD: ${DB_PASSWORD:-ihsg_pass}
      REDIS_HOST: redis
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}

volumes:
  pgdata:
