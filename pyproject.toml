[project]
name = "ihsg-predictor"
version = "0.1.0"
description = "IHSG Predictor - Django + Prophet"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
