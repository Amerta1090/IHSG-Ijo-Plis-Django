name: Weekly Retrain Pipeline

on:
  schedule:
    # Every Monday at 07:00 WIB (00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

env:
  DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
  DJANGO_SETTINGS_MODULE: config.settings.prod
  ALLOWED_HOSTS: localhost
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_DB_NAME: postgres
  SUPABASE_DB_USER: postgres
  SUPABASE_DB_PORT: 5432

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create media/models directory
        run: mkdir -p media/models

      - name: Run full retrain (IHSG + USD/IDR)
        run: python manage.py retrain_all

      - name: Upload trained models as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prophet-models
          path: media/models/
          retention-days: 7
