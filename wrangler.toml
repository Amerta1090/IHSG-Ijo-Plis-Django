# 
# Deployment options:
#   1. Railway / Fly.io / VPS + Cloudflare DNS (orange cloud proxy)
#   2. Cloudflare Tunnel (cloudflared) → local/VPS Django server
#   3. Static export + Cloudflare Pages (loses dynamic features)
#
# Workers route example (reverse proxy):
# [routes]
# example.com/* = {zone_id = "...", pattern = "example.com/*"}
